name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "sandbox/**"
      - "mkdocs.yml"
      - "README.md"
      - "requirements-docs.txt"
      - ".devcontainer/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "sandbox/**"
      - "mkdocs.yml"
      - "README.md"
      - "requirements-docs.txt"
      - ".devcontainer/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build docs (strict)
        run: mkdocs build --strict

  # 降级为手动触发（workflow_dispatch）。本 job 校验 evaluation_edge.schema.v0.json 的离线完备性，
  # 属 ADR-0011 冻结口径下的静态归档样例校验，价值远低于 build（守护 AI 跨会话记忆源不腐坏）。
  # 每次 PR 必跑属浪费 CI 分钟，故改为仅手动运行；如需重跑：Actions 页 → docs → Run workflow。
  sandbox-validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sandbox dependencies
        run: pip install jsonschema cryptography

      - name: Run sandbox validators (schema + red lines + k-anonymity)
        run: |
          for f in sandbox/*/validate_edges.py; do
            echo "== $f =="
            python "$f"
          done
